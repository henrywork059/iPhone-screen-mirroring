name: Windows source checks

on:
  push:
    branches: [main]
    paths:
      - 'src/MirrorControl/**'
      - 'tests/ControlLogicTests/**'
      - 'scripts/*.ps1'
      - 'scripts/ci/*.ps1'
      - '.github/workflows/experimental-airplay-beta.yml'
      - '.github/workflows/controller-package.yml'
      - '.github/workflows/signed-windows-release.yml'
      - 'config/**'
      - '.github/workflows/windows-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('scripts/Start-Mirroring.ps1', 'scripts/Check-Prerequisites.ps1', 'scripts/Inspect-TestReadiness.ps1', 'scripts/ci/Test-NoNetworkRuntimeLoad.ps1', 'scripts/ci/New-NativeSbom.ps1', 'scripts/ci/Assert-TrustedWindowsSignatures.ps1', 'scripts/ci/Build-ApprovedSignedRelease.ps1')
          foreach ($path in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax invalid: $path"
            }
            Write-Host "Syntax OK: $path"
          }
      - name: Verify emergency security hold
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gate = Get-Content src/MirrorControl/BackendSecurityGate.cs -Raw
          $launcher = Get-Content scripts/Start-Mirroring.ps1 -Raw
          if ($gate -notmatch 'internal static bool IsBlocked\s*=>\s*true\s*;') {
            throw 'SECURITY HOLD regression: GUI backend launch gate was removed.'
          }
          if ($launcher -notmatch '(?m)^throw ''SECURITY HOLD:') {
            throw 'SECURITY HOLD regression: PowerShell receiver launcher was unblocked.'
          }
          $processController = Get-Content src/MirrorControl/ReceiverProcess.cs -Raw
          $receiverIdentity = Get-Content src/MirrorControl/ReceiverIdentity.cs -Raw
          if ($processController -notmatch 'ReceiverIdentity.Validate\(executable\)') {
            throw 'SECURITY HOLD regression: receiver process does not validate the binary.'
          }
          if ($receiverIdentity -notmatch 'if \(BackendSecurityGate.IsBlocked\)') {
            throw 'SECURITY HOLD regression: binary validation no longer enforces the default gate.'
          }
          if ($gate -notmatch '(?s)#if EXPERIMENTAL_RECEIVER.*IsBlocked\s*=>\s*false.*#else.*IsBlocked\s*=>\s*true') {
            throw 'Opt-in and default release gates are not separated.'
          }
          Write-Host 'Emergency security hold remains active. This is not an audit.'
      - name: Enforce automatic unsigned artifact publishing hold
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $offline = Get-Content .github/workflows/controller-package.yml -Raw
          if ($offline -match 'actions/upload-artifact|gh release (create|upload)|softprops/action-gh-release') {
            throw 'SECURITY HOLD: offline controller must not publish an unsigned ZIP.'
          }
          $beta = Get-Content .github/workflows/experimental-airplay-beta.yml -Raw
          if ($beta -match 'gh release (create|upload)|softprops/action-gh-release') {
            throw 'SECURITY HOLD: experimental beta must not create GitHub Releases.'
          }
          if ($beta -notmatch 'type: boolean' -or
              $beta -notmatch 'acknowledge_unsigned:' -or
              $beta -notmatch "default: false") {
            throw 'Unsigned download acknowledgement is missing or enabled by default.'
          }
          $requiredGuard = "if: " + '$' + "{{ github.event_name == 'workflow_dispatch' && inputs.acknowledge_unsigned }}"
          if (-not $beta.Contains($requiredGuard)) {
            throw 'SECURITY HOLD: unsigned ZIP uploads must be manual and explicitly acknowledged.'
          }
          if ($beta -notmatch 'uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f') {
            throw 'Manual unsigned beta upload is not pinned to the checked Node 24-compatible action.'
          }
          Write-Host 'Automatic unsigned publication blocked; manual diagnostic ZIP requires explicit acknowledgement.'
      - name: Verify signed release cannot bypass review or publisher checks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workflow = Get-Content .github/workflows/signed-windows-release.yml -Raw
          $script = Get-Content scripts/ci/Build-ApprovedSignedRelease.ps1 -Raw
          foreach ($required in @(
            'environment: approved-windows-release',
            'SECURITY_REVIEWED_SHA',
            'DEVICE_TESTED_SHA',
            'TRUSTED_PUBLISHER_SUBJECT',
            'secrets.WINDOWS_SIGNING_PFX_BASE64',
            'secrets.WINDOWS_SIGNING_PFX_PASSWORD',
            'Assert-TrustedWindowsSignatures.ps1'
          )) {
            if (($workflow + $script) -notmatch [regex]::Escape($required)) {
              throw "Signed release missing approval/signature guard: $required"
            }
          }
          if ($workflow -match '(?m)^  push:' -or
              $workflow -match '(?m)^  release:') {
            throw 'Signed executable release must not run on automatic pushes.'
          }
          Write-Host 'Signed release requires separate review, device approval, and trusted publisher signatures.'
      - name: Smoke-test CycloneDX generator with harmless synthetic files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'iphone-mirror-sbom-test'
          New-Item -ItemType Directory -Force -Path (Join-Path $fake 'bin') | Out-Null
          foreach ($filename in @('uxplay.exe','dependency.dll','scanner.exe')) {
            Set-Content -LiteralPath (Join-Path $fake "bin/$filename") -Value "fixture only - $filename"
          }
          Set-Content -LiteralPath (Join-Path $fake 'SHA256SUMS.txt') -Value 'offline test inventory'
          pwsh -NoProfile -File scripts/ci/New-NativeSbom.ps1 -NativeRoot $fake
          if ($LASTEXITCODE -ne 0) { throw 'Native CycloneDX generator failed' }
          $report = Get-Content (Join-Path $fake 'native-components.cdx.json') -Raw | ConvertFrom-Json
          if ($report.bomFormat -ne 'CycloneDX' -or $report.components.Count -ne 3) {
            throw 'Native CycloneDX generator returned an invalid file inventory'
          }
      - name: Check mirroring resolution profiles
        run: dotnet run --project tests/ControlLogicTests/ControlLogicTests.csproj --configuration Release
      - name: Build Windows controller
        run: dotnet build src/MirrorControl/MirrorControl.csproj --configuration Release
      # No prebuilt UxPlay binaries, installers, or release artifacts are distributed.
