name: Windows source checks

on:
  push:
    branches: [main]
    paths:
      - 'src/MirrorControl/**'
      - 'tests/ControlLogicTests/**'
      - 'scripts/*.ps1'
      - 'scripts/ci/*.ps1'
      - '.github/workflows/experimental-airplay-beta.yml'
      - '.github/workflows/controller-package.yml'
      - 'config/**'
      - '.github/workflows/windows-checks.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('scripts/Start-Mirroring.ps1', 'scripts/Check-Prerequisites.ps1', 'scripts/Inspect-TestReadiness.ps1', 'scripts/ci/Test-NoNetworkRuntimeLoad.ps1', 'scripts/ci/New-NativeSbom.ps1', 'scripts/ci/Assert-TrustedWindowsSignatures.ps1')
          foreach ($path in $files) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List | Out-String | Write-Error
              throw "PowerShell syntax invalid: $path"
            }
            Write-Host "Syntax OK: $path"
          }
      - name: Verify emergency security hold
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gate = Get-Content src/MirrorControl/BackendSecurityGate.cs -Raw
          $launcher = Get-Content scripts/Start-Mirroring.ps1 -Raw
          if ($gate -notmatch 'internal static bool IsBlocked\s*=>\s*true\s*;') {
            throw 'SECURITY HOLD regression: GUI backend launch gate was removed.'
          }
          if ($launcher -notmatch '(?m)^throw ''SECURITY HOLD:') {
            throw 'SECURITY HOLD regression: PowerShell receiver launcher was unblocked.'
          }
          $processController = Get-Content src/MirrorControl/ReceiverProcess.cs -Raw
          $receiverIdentity = Get-Content src/MirrorControl/ReceiverIdentity.cs -Raw
          if ($processController -notmatch 'ReceiverIdentity.Validate\(executable\)') {
            throw 'SECURITY HOLD regression: receiver process does not validate the binary.'
          }
          if ($receiverIdentity -notmatch 'if \(BackendSecurityGate.IsBlocked\)') {
            throw 'SECURITY HOLD regression: binary validation no longer enforces the default gate.'
          }
          if ($gate -notmatch '(?s)#if EXPERIMENTAL_RECEIVER.*IsBlocked\s*=>\s*false.*#else.*IsBlocked\s*=>\s*true') {
            throw 'Opt-in and default release gates are not separated.'
          }
          Write-Host 'Emergency security hold remains active. This is not an audit.'
      - name: Enforce unsigned artifact publishing hold
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('.github/workflows/experimental-airplay-beta.yml',
                               '.github/workflows/controller-package.yml')) {
            $source = Get-Content $file -Raw
            if ($source -match 'actions/upload-artifact' -or
                $source -match 'gh release (create|upload)' -or
                $source -match 'softprops/action-gh-release') {
              throw "SECURITY HOLD: unsigned artifact publishing action present in $file"
            }
          }
          Write-Host 'Unsigned receiver and controller artifact uploads remain disabled.'
      - name: Smoke-test CycloneDX generator with harmless synthetic files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fake = Join-Path $env:RUNNER_TEMP 'iphone-mirror-sbom-test'
          New-Item -ItemType Directory -Force -Path (Join-Path $fake 'bin') | Out-Null
          foreach ($filename in @('uxplay.exe','dependency.dll','scanner.exe')) {
            Set-Content -LiteralPath (Join-Path $fake "bin/$filename") -Value "fixture only - $filename"
          }
          Set-Content -LiteralPath (Join-Path $fake 'SHA256SUMS.txt') -Value 'offline test inventory'
          pwsh -NoProfile -File scripts/ci/New-NativeSbom.ps1 -NativeRoot $fake
          if ($LASTEXITCODE -ne 0) { throw 'Native CycloneDX generator failed' }
          $report = Get-Content (Join-Path $fake 'native-components.cdx.json') -Raw | ConvertFrom-Json
          if ($report.bomFormat -ne 'CycloneDX' -or $report.components.Count -ne 3) {
            throw 'Native CycloneDX generator returned an invalid file inventory'
          }
      - name: Check mirroring resolution profiles
        run: dotnet run --project tests/ControlLogicTests/ControlLogicTests.csproj --configuration Release
      - name: Build Windows controller
        run: dotnet build src/MirrorControl/MirrorControl.csproj --configuration Release
      # No prebuilt UxPlay binaries, installers, or release artifacts are distributed.
