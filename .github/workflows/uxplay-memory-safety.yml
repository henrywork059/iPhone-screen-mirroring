name: UxPlay C memory-safety regression (offline)

on:
  push:
    branches: [main]
    paths:
      - 'tests/native/**'
      - 'patches/uxplay-mirror-short-frame.patch'
      - 'scripts/ci/test-uxplay-mirror-*.sh'
      - '.github/workflows/uxplay-memory-safety.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  asan-ubsan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Run offline C regression against patched upstream source
        shell: bash
        run: bash scripts/ci/test-uxplay-mirror-sanitizers.sh
  windows-functional:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout project
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Set up MSYS2 UCRT64 compiler and OpenSSL
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-openssl
      - name: Run Windows C functional regression
        shell: msys2 {0}
        run: bash scripts/ci/test-uxplay-mirror-windows.sh
