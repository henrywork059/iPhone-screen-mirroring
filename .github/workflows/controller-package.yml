name: Windows offline controller packaging (no receiver)

on:
  push:
    branches: [main]
    paths:
      - 'src/MirrorControl/**'
      - 'config/**'
      - '.github/workflows/controller-package.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-package-only:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 8.0.x
      - name: Build self-contained offline Windows controller and inspect ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gate = Get-Content src/MirrorControl/BackendSecurityGate.cs -Raw
          if ($gate -notmatch 'internal static bool IsBlocked\s*=>\s*true\s*;') {
            throw 'Unexpected unblocked app. Do not create an offline test package.'
          }
          dotnet publish src/MirrorControl/MirrorControl.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false --output offline-controller
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          $exe = 'offline-controller/MirrorControl.exe'
          $config = 'offline-controller/config/uxplayrc'
          if (-not (Test-Path $exe -PathType Leaf)) { throw 'Missing compiled GUI' }
          if (-not (Test-Path $config -PathType Leaf)) { throw 'Missing startup config' }
          if (Test-Path 'offline-controller/uxplay.exe') { throw 'Receiver must not be bundled in offline package' }
          Set-Content -Path offline-controller/READ-ME-FIRST.txt -Value @(
            'OFFLINE UI PREVIEW ONLY. No AirPlay receiver or mirroring functionality included.',
            'The Start Receiver control is intentionally disabled for security.',
            'Extract ZIP, run MirrorControl.exe, and check the window only.',
            'Do not adjust Windows Firewall or connect an iPhone for this preview.')
          Compress-Archive -Path offline-controller/* -DestinationPath offline-controller.zip -CompressionLevel Optimal
          $hash = Get-FileHash offline-controller.zip -Algorithm SHA256
          Write-Host ('Offline controller ZIP SHA256: ' + $hash.Hash)
          Write-Host ('Offline controller ZIP bytes: ' + (Get-Item offline-controller.zip).Length)
          Write-Host 'Built and checked. No binary or ZIP is published by this workflow.'
      # The offline UI is also unsigned: keep it out of user distribution
      # while Smart App Control is enabled, rather than encouraging bypass.
      - name: Enforce offline unsigned distribution hold
        run: echo 'SECURITY HOLD - no unsigned controller ZIP is uploaded.'
