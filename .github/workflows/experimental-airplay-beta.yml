name: Experimental AirPlay receiver beta (actual mirroring, opt-in)

on:
  push:
    branches: [main]
    paths:
      - 'src/MirrorControl/**'
      - 'third_party/blehid/**'
      - 'scripts/ci/build-full-receiver-windows.sh'
      - 'scripts/ci/stage-native-runtime.sh'
      - 'patches/uxplay-experimental-mirror-short-frame.patch'
      - 'tests/native/**'
      - '.github/workflows/experimental-airplay-beta.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-mirroring-test-bundle:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout project source
        uses: actions/checkout@v4
      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Set up UCRT64 compiler, receiver and media dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
            mingw-w64-ucrt-x86_64-json-glib
      - name: Build pinned and patched receiver, run crypto checks, and collect runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          RECEIVER_STAGING_DIR="$(pwd)/_beta/native" bash scripts/ci/build-full-receiver-windows.sh
          bash scripts/ci/stage-native-runtime.sh "$(pwd)/_beta/native"
          # Keep corresponding source and dependency license notices with any binary.
          if [[ -d /ucrt64/share/licenses ]]; then
            cp -R /ucrt64/share/licenses "$(pwd)/_beta/native/source-notices/MSYS2-third-party-licenses"
          fi
          pacman -Q > "$(pwd)/_beta/native/source-notices/MSYS2-installed-package-inventory.txt"
          test -s _beta/native/source-notices/uxplay-patched-corresponding-source.tar.gz
          echo 'Receiver staged with corresponding source; no network listener started.'
      - name: Verify GStreamer elements and packaged codec plugins
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export GST_PLUGIN_PATH_1_0="$(pwd)/_beta/native/lib/gstreamer-1.0"
          export GST_PLUGIN_SYSTEM_PATH_1_0=''
          for element in d3d11videosink wasapisink h264parse avdec_h264 h265parse avdec_h265; do
            echo "Checking GStreamer element: $element"
            gst-inspect-1.0 "$element" >/dev/null
          done
          echo 'GStreamer sink and H.264 elements are installed. Actual media streaming not yet tested.'
      - name: Check UxPlay relocated runtime imports without network listener
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File scripts/ci/Test-NoNetworkRuntimeLoad.ps1 -Executable _beta/native/bin/uxplay.exe -PluginDirectory _beta/native/lib/gstreamer-1.0
          if ($LASTEXITCODE -ne 0) { throw 'Native help-only process check failed' }
      - name: Ensure hardware-bridge implementation is excluded
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($removed in @(
            'src/MirrorControl/HidControlForm.cs',
            'src/MirrorControl/HidProtocol.cs',
            'firmware/esp32_hid_bridge/esp32_hid_bridge.ino',
            'docs/INPUT_BRIDGE.md')) {
              if (Test-Path $removed) { throw "Removed bridge code unexpectedly present: $removed" }
          }
          if ((Get-Content src/MirrorControl/MirrorForm.cs -Raw) -match 'Input pad \(ESP32\)|new HidControlForm') {
            throw 'Hardware input control has been reintroduced.'
          }
          if ((Get-Content src/MirrorControl/MirrorControl.csproj -Raw) -match 'System.IO.Ports') {
            throw 'Unneeded serial port dependency found.'
          }
          Write-Host 'Hardware input bridge excluded; resolution selection retained.'
      - name: Stage pinned Windows BLE HID CLI v0.6.0 (MIT; explicit opt-in)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/abhishek-raj/windows-ble-hid/releases/download/v0.6.0/BleHid-Cli-v0.6.0-win-x64.zip'
          $archive = Join-Path $PWD '_beta/BleHid-Cli-v0.6.0-win-x64.zip'
          Invoke-WebRequest -Uri $url -OutFile $archive
          $expected = '0BBB2E85BEBC783E304E3E46769F3000897F18B72FA646B253B3B0FF292F87B7'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw 'Upstream BLE HID v0.6.0 release digest mismatch.' }
          Expand-Archive -LiteralPath $archive -DestinationPath _beta/blehid-unpack -Force
          $cli = Get-ChildItem _beta/blehid-unpack -Filter BleHid.Cli.exe -File -Recurse |
            Select-Object -First 1
          if ($null -eq $cli) { throw 'Verified BLE HID release contains no CLI executable.' }
          New-Item -ItemType Directory -Path _beta/blehid-stage -Force | Out-Null
          Copy-Item -LiteralPath $cli.FullName -Destination _beta/blehid-stage/BleHid.Cli.exe
          Copy-Item -LiteralPath third_party/blehid/LICENSE -Destination _beta/blehid-stage/LICENSE-MIT.txt
          $sha = (Get-FileHash -LiteralPath _beta/blehid-stage/BleHid.Cli.exe -Algorithm SHA256).Hash
          "BLEHID_EXE_SHA256=$sha" >> $env:GITHUB_ENV
          Write-Host "Verified BLE HID archive; pinned CLI executable SHA256: $sha"
      - name: Build only the explicit experimental controller variant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Get-Content src/MirrorControl/BackendSecurityGate.cs -Raw
          if ($source -notmatch '(?s)#if EXPERIMENTAL_RECEIVER.*IsBlocked\s*=>\s*false.*#else.*IsBlocked\s*=>\s*true') {
            throw 'The default locked build / explicit opt-in separation is missing.'
          }
          $receiver = Resolve-Path _beta/native/bin/uxplay.exe
          $sha = (Get-FileHash -LiteralPath $receiver -Algorithm SHA256).Hash
          $code = @"
          #if !EXPERIMENTAL_RECEIVER
          #error This package must compile with EXPERIMENTAL_RECEIVER enabled
          #endif
          namespace MirrorControl;
          internal static class ExperimentalBuildIdentity
          {
              internal const string UxPlaySha256 = "$sha";
              internal const string BleHidSha256 = "$env:BLEHID_EXE_SHA256";
          }
          "@
          $code | Set-Content src/MirrorControl/ExperimentalBuildIdentity.g.cs -Encoding utf8
          dotnet publish src/MirrorControl/MirrorControl.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:EnableExperimentalReceiver=true --output _beta/desktop
          if ($LASTEXITCODE -ne 0) { throw 'Experimental GUI publish failed' }
          Copy-Item _beta/native _beta/desktop/native -Recurse
          Copy-Item _beta/blehid-stage _beta/desktop/bluetooth -Recurse
          foreach ($path in @(
            '_beta/desktop/MirrorControl.exe',
            '_beta/desktop/config/uxplayrc',
            '_beta/desktop/native/bin/uxplay.exe',
            '_beta/desktop/native/source-notices/uxplay-patched-corresponding-source.tar.gz',
            '_beta/desktop/native/source-notices/UXPLAY-GPL-3.0-LICENSE',
            '_beta/desktop/native/source-notices/MSYS2-installed-package-inventory.txt',
            '_beta/desktop/native/lib/gstreamer-1.0',
            '_beta/desktop/bluetooth/BleHid.Cli.exe',
            '_beta/desktop/bluetooth/LICENSE-MIT.txt')) {
            if (-not (Test-Path $path)) { throw "Missing test bundle component: $path" }
          }
          $bleCopiedSha = (Get-FileHash _beta/desktop/bluetooth/BleHid.Cli.exe -Algorithm SHA256).Hash
          if ($bleCopiedSha -ne $env:BLEHID_EXE_SHA256) { throw 'The pinned BLE HID executable changed after checksum binding.' }
          $copiedSha = (Get-FileHash _beta/desktop/native/bin/uxplay.exe -Algorithm SHA256).Hash
          if ($copiedSha -ne $sha) { throw 'The packaged native binary changed after binding its checksum.' }
          @(
            'IPHONE MIRROR — EXPERIMENTAL NETWORK TEST BUILD. NOT SECURITY AUDITED.',
            'This package DOES include a functional AirPlay receiver. It can open listening ports.',
            'Run only on a TRUSTED PRIVATE/ISOLATED local network with a non-sensitive iPhone.',
            'Do not ignore Windows Defender or SmartScreen warnings; do not disable your firewall.',
            'Start with MirrorControl.exe as a normal user. Confirm the warning when asked.',
            'On iPhone open Control Center > Screen Mirroring > iPhone Mirror.',
            'The pairing PIN is printed in a separate UxPlay console window.',
            'The video appears in a separate GStreamer-rendered window, not inside this controller.',
            'OPTIONAL: Bluetooth control requires a BLE-peripheral capable Windows adapter (already detected on the target laptop).',
            'Exit any existing BleHid.Cli.exe before opening Bluetooth control in the controller.',
            'Click Bluetooth control > Start Bluetooth. Pair your own iPhone and enable AssistiveTouch.',
            'Click Refresh paired hosts, select ONLY your iPhone, then use keyboard/mouse buttons or capture.',
            'CAUTION: During capture press Ctrl+Alt+Q to return keyboard and mouse to Windows.',
            'Bluetooth input is relative; it is NOT automatically calibrated to the separate video window.',
            'The optional Bluetooth executable is BleHid v0.6.0 (MIT), verified by official ZIP SHA-256 and embedded executable SHA-256.',
            'If the iPhone cannot see the receiver, inspect Windows Firewall PRIVATE profile only.',
            'Do not grant PUBLIC inbound access. Stop the receiver when finished.',
            'The exact patched UxPlay corresponding source and notices are under native/source-notices.',
            'Use only for a supervised compatibility test. No routine or sensitive-content use.') |
            Set-Content _beta/desktop/READ-ME-FIRST-EXPERIMENTAL.txt -Encoding utf8
          Compress-Archive -Path _beta/desktop/* -DestinationPath _beta/iPhoneMirror-Experimental-AirPlay-TEST.zip -CompressionLevel Optimal
          $zip = Get-Item _beta/iPhoneMirror-Experimental-AirPlay-TEST.zip
          $digest = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash
          Write-Host ('Experimental test ZIP bytes: ' + $zip.Length)
          Write-Host ('Experimental test ZIP SHA-256: ' + $digest)
          Write-Host ('Pinned receiver SHA-256 embedded in GUI: ' + $sha)
      - name: Upload opt-in experimental AirPlay mirroring test bundle
        uses: actions/upload-artifact@v4
        with:
          name: iPhoneMirror-Experimental-AirPlay-TEST
          path: _beta/iPhoneMirror-Experimental-AirPlay-TEST.zip
          retention-days: 7
          if-no-files-found: error
      # This is an explicitly experimental artifact, not a stable GitHub Release.
