name: Windows complete receiver build (blocked, no execution)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  full-source-build-only:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout application repository
        uses: actions/checkout@v4
      - name: Install MSYS2 UCRT64 build toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-libplist
            mingw-w64-ucrt-x86_64-gstreamer
            mingw-w64-ucrt-x86_64-gst-plugins-base
            mingw-w64-ucrt-x86_64-gst-plugins-good
            mingw-w64-ucrt-x86_64-gst-plugins-bad
            mingw-w64-ucrt-x86_64-gst-libav
      - name: Build complete pinned patched UxPlay without starting it
        shell: msys2 {0}
        run: bash scripts/ci/build-full-receiver-windows.sh
      # No UxPlay binaries or DLLs are uploaded by this workflow.
